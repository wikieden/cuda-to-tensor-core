<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMT 与 Tile</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.mono{font-family:ui-monospace,Menlo,monospace}svg text.tiny{font-size:10px;fill:var(--muted)}</style></head>
<body><main>
<h1>第 24 章 · SIMT 视角 vs Tile 视角</h1>
<p class="sub">配套讲义：<a href="../lessons/24-tile-dsl.html">第 24 章 · Tile 模型与 kernel DSL：cuTile、Triton、CuTe DSL、TileLang、Helion</a>。同一个 16 × 16 矩阵加法，切成 4 个 8 × 8 的 tile 分给 4 个 block。放大 block 1 看里面发生了什么。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 400"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row ctl" id="ctl"><label>模型：</label><span id="g1"></span></div>
<div class="stats"><div class="stat"><div class="l">你要写的</div><div class="v" id="sy"></div></div><div class="stat"><div class="l">编译器替你做的</div><div class="v" id="sc"></div></div></div>
<p class="note">看点：① SIMT：64 个线程各自算下标、各取一个元素、做越界检查；② Tile：整块 load、整块相加、整块 store，线程数由编译器决定；③ 两种写法跑的是同样的硬件。</p>
</main>
<script src="anim.js"></script>
<script src="cuda-anim.js"></script>
<script>
const sv=$('sv');
let M=0,k=0;
const SIMT=['i = blockIdx*blockDim + threadIdx','if (i < n) 越界检查','c[i] = a[i] + b[i]（每人一个）','（需要时）__shared__ + __syncthreads()'];
const TILE=['ta = load(a, index=(bid,), shape=(8, 8))','tb = load(b, ...)','store(c, ta + tb)'];
function reset(){k=0;draw()}
function next(){if(k>=(M?3:4))return false;k++;draw();return true}
function draw(){clear(sv);
 cap(sv,M?'Tile：按 block 写':'SIMT：按线程写');
 for(let b=0;b<4;b++){R(sv,20+(b%2)*84,60+Math.floor(b/2)*84,80,80,{fill:b===1?'var(--accent-bg)':'var(--card)',stroke:b===1?'var(--accent)':'var(--line)'});T(sv,'block '+b,60+(b%2)*84,104+Math.floor(b/2)*84,{a:'middle',size:11})}
 const zx=220,zy=60,cs=22;T(sv,'放大 block 1（8 × 8）',zx,zy-8,{cls:'tiny'});
 for(let i=0;i<8;i++)for(let j=0;j<8;j++){const t=i*8+j;let on=false;if(!M)on=t<k*16;else on=k>=1;
  R(sv,zx+j*cs,zy+i*cs,cs-2,cs-2,{fill:on?(M?'var(--teal)':'var(--accent)'):'var(--bg)',stroke:on?'none':'var(--line)',rx:2});if(!M&&on&&cs>=20)T(sv,t,zx+j*cs+10,zy+i*cs+14,{a:'middle',size:8,fill:'#fff'})}
 if(M&&k>=1)T(sv,k===1?'整块 load':k===2?'整块相加（编译器分给线程）':'整块 store',zx,zy+8*cs+20,{size:12,fill:'var(--teal)'});
 if(!M&&k>=1)T(sv,`${Math.min(64,k*16)} / 64 个线程已各自算下标、取数`,zx,zy+8*cs+20,{size:12,fill:'var(--accent)'});
 const L1=M?TILE:SIMT;T(sv,'代码',430,60,{bold:1});L1.forEach((s,i)=>{R(sv,430,70+i*44,236,36,{fill:i<k?'var(--card)':'var(--bg)',stroke:'var(--line)'});T(sv,s,436,92+i*44,{size:10,mono:1,fill:i<k?'var(--text)':'var(--muted)'})});
 T(sv,M?'没有 threadIdx、没有越界 if、没有 shared、没有同步':'线程编号、越界、shared、同步都要自己写',20,380,{size:12,fill:M?'var(--good)':'var(--warm)'});
 stat('sy',M?'tile 形状、block 负责哪块':'线程映射、越界、shared、同步');stat('sc',M?'线程映射、shared、异步、Tensor Core':'寄存器分配、指令调度');sy();}
const sy=radio('g1',[{id:'s',label:'SIMT',value:0},{id:'t',label:'Tile',value:1}],()=>M,v=>{M=v;reset()});
setupPlayer({captureSeed:1,reset,next},1300);
</script></body></html>
