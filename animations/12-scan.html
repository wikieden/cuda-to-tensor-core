<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>前缀和 scan</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.mono{font-family:ui-monospace,Menlo,monospace}svg text.tiny{font-size:10px;fill:var(--muted)}</style></head>
<body><main>
<h1>第 12 章 · Hillis–Steele 与 Blelloch</h1>
<p class="sub">配套讲义：<a href="../lessons/12-scan.html">第 12 章 · 前缀和 scan：每个位置都要&quot;前面所有数的和&quot;</a>。8 个数，每轮画出谁加到谁身上。Hillis–Steele 出 inclusive 结果；Blelloch 先上扫、根清零、再下扫，出 exclusive 结果。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 420"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row ctl" id="ctl"><label>算法：</label><span id="g1"></span></div>
<div class="stats"><div class="stat"><div class="l">累计加法次数</div><div class="v" id="sa"></div></div><div class="stat"><div class="l">轮数</div><div class="v" id="sn"></div></div><div class="stat"><div class="l">结果类型</div><div class="v" id="sk"></div></div></div>
<p class="note">看点：① Hillis–Steele 每轮箭头跨度翻倍，3 轮、加法 17 次；② Blelloch 6 轮（加清零一步），加法只有 14 次（7 + 7）；③ N 越大，两者工作量差得越多（N log N vs 2N）。</p>
</main>
<script src="anim.js"></script>
<script src="cuda-anim.js"></script>
<script>
const sv=$('sv');
const V0=[3,1,4,1,5,9,2,6],N=8;let mode=0,k=0;
function plan(){const S=[{v:V0.slice(),a:[],n:'初始'}];let v=V0.slice();
 if(mode===0){for(let d=1;d<N;d*=2){const nv=v.slice(),a=[];for(let t=d;t<N;t++){nv[t]=v[t]+v[t-d];a.push([t-d,t,'+'])}v=nv;S.push({v,a,n:`加上左边隔 ${d} 个的数`})}}
 else{for(let d=1;d<N;d*=2){const nv=v.slice(),a=[];for(let t=2*d-1;t<N;t+=2*d){nv[t]=v[t]+v[t-d];a.push([t-d,t,'+'])}v=nv;S.push({v,a,n:`上扫：跨度 ${d}`})}
  v=v.slice();v[N-1]=0;S.push({v,a:[],n:'根（最后一格）清零'});
  for(let d=N/2;d>=1;d/=2){const nv=v.slice(),a=[];for(let t=2*d-1;t<N;t+=2*d){nv[t-d]=v[t];nv[t]=v[t]+v[t-d];a.push([t,t-d,'→']);a.push([t-d,t,'+'])}v=nv;S.push({v,a,n:`下扫：跨度 ${d}`})}}
 return S}
function reset(){k=0;draw()}
function next(){if(k>=plan().length-1)return false;k++;draw();return true}
function draw(){clear(sv);arrowDefs(sv);const P=plan(),cw=74,x0=60,rows=P.length,rh=Math.min(56,360/rows);
 cap(sv,P[k].n);let adds=0;
 for(let i=0;i<=k;i++){const y=44+i*rh,s=P[i];adds+=s.a.filter(a=>a[2]==='+').length;T(sv,i,20,y+18,{cls:'tiny'});
  s.v.forEach((v,j)=>{const hot=s.a.some(a=>a[1]===j);R(sv,x0+j*cw,y,56,rh-24,{fill:hot&&i===k?'var(--accent-bg)':'var(--bg)',stroke:hot?'var(--accent)':'var(--line)'});T(sv,v,x0+j*cw+28,y+(rh-24)/2+5,{a:'middle',size:12})});
  if(i>0&&i===k)s.a.forEach(([f,t,o])=>L(sv,x0+f*cw+28,y-24,x0+t*cw+28,y-2,{stroke:o==='+'?'var(--accent)':'var(--purple)',arrow:1}))}
 stat('sa',adds);stat('sn',k);stat('sk',mode===0?'inclusive':'exclusive');sy();}
const sy=radio('g1',[{id:'h',label:'Hillis–Steele',value:0},{id:'b',label:'Blelloch',value:1}],()=>mode,v=>{mode=v;reset()});
setupPlayer({captureSeed:1,reset,next},1500);
</script></body></html>
