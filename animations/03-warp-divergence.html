<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>warp 分岔</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.mono{font-family:ui-monospace,Menlo,monospace}svg text.tiny{font-size:10px;fill:var(--muted)}</style></head>
<body><main>
<h1>第 3 章 · 一个 warp 遇到 if</h1>
<p class="sub">配套讲义：<a href="../lessons/03-warp-simt.html">第 3 章 · warp 与 SIMT：32 个线程一起走，分岔了怎么办</a>。2 个 warp，每个画成 8 个 lane（真实是 32 个）。一条指令一个时间单位；亮色在干活，灰色被屏蔽。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row ctl" id="ctl"><label>分支条件：</label><span id="g1"></span></div>
<div class="stats"><div class="stat"><div class="l">warp 0 用时</div><div class="v" id="st0"></div></div><div class="stat"><div class="l">warp 1 用时</div><div class="v" id="st1"></div></div><div class="stat"><div class="l">lane 利用率</div><div class="v" id="su"></div></div></div>
<p class="note">看点：① 按 lane 分（lane % 2）时两个 warp 都要把 A、B 各走一遍；② 按 warp 分时每个 warp 只走自己那条路；③ 分岔只发生在 warp 内部。</p>
</main>
<script src="anim.js"></script>
<script src="cuda-anim.js"></script>
<script>
const sv=$('sv');
let mode=0,k=0;const NL=8;
const MODES=[{l:'lane % 2 == 0',f:(w,l)=>l%2===0},{l:'lane < 4',f:(w,l)=>l<4},{l:'warp % 2 == 0',f:(w,l)=>w%2===0}];
function prog(w){const c=MODES[mode].f,t=[...Array(NL).keys()].map(l=>c(w,l)),seq=[{n:'x = load()',m:Array(NL).fill(true)}];
 if(t.some(v=>v))seq.push({n:'if 分支：a()',m:t});if(t.some(v=>!v))seq.push({n:'else 分支：b()',m:t.map(v=>!v)});seq.push({n:'store(x)',m:Array(NL).fill(true)});return seq}
function reset(){k=0;draw()}
function maxLen(){return Math.max(prog(0).length,prog(1).length)}
function next(){if(k>=maxLen())return false;k++;draw();return true}
function draw(){clear(sv);const P=[prog(0),prog(1)];
 cap(sv,k===0?`条件：${MODES[mode].l}`:k<maxLen()+1?`第 ${k} 个时间单位`:'');
 for(let w=0;w<2;w++){const y=60+w*130,p=P[w],cur=p[k-1];
  T(sv,`warp ${w}`,20,y+24,{bold:1});
  for(let l=0;l<NL;l++){const on=cur&&cur.m[l];R(sv,90+l*42,y,36,36,{fill:cur?(on?'var(--accent)':'var(--card)'):'var(--bg)',stroke:on?'var(--accent)':'var(--line)'});T(sv,'lane '+(l+w*NL),90+l*42+18,y+52,{a:'middle',cls:'tiny'});
   if(cur)T(sv,on?'干活':'等',90+l*42+18,y+23,{a:'middle',size:11,fill:on?'#fff':'var(--muted)'})}
  T(sv,cur?cur.n:(k>p.length?'已完成':'—'),440,y+24,{mono:1,fill:cur?'var(--text)':'var(--muted)'});
  // 时间线
  p.forEach((s,i)=>{const act=s.m.filter(Boolean).length;R(sv,90+i*60,y+68,56,22,{fill:i<k?(act===NL?'var(--accent-bg)':'var(--amber)'):'var(--bg)',stroke:'var(--line)',op:i<k?1:.5});T(sv,`${act}/${NL}`,90+i*60+28,y+83,{a:'middle',size:11})});
  T(sv,'时间线（数字 = 干活的 lane）',440,y+84,{cls:'m'})}
 const used=P.reduce((a,p)=>a+p.length,0),act=P.reduce((a,p)=>a+p.reduce((b,s)=>b+s.m.filter(Boolean).length,0),0);
 stat('st0',P[0].length+' 单位');stat('st1',P[1].length+' 单位');stat('su',(act/(used*NL)*100).toFixed(0)+'%');sy();}
const sy=radio('g1',MODES.map((m,i)=>({id:'m'+i,label:m.l,value:i})),()=>mode,v=>{mode=v;reset()});
setupPlayer({captureSeed:1,reset,next},1300);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
