<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>异步拷贝流水线</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.mono{font-family:ui-monospace,Menlo,monospace}svg text.tiny{font-size:10px;fill:var(--muted)}</style></head>
<body><main>
<h1>第 16 章 · 同步 vs 双缓冲 vs 三级流水线</h1>
<p class="sub">配套讲义：<a href="../lessons/16-async-copy-pipeline.html">第 16 章 · 异步拷贝与多级流水线：搬下一块的时候算这一块</a>。上面一条轴是"搬"（显存 → shared），下面是"算"。编号相同的块先搬后算；S 级流水线最多有 S 块同时占着 shared buffer。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 300"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row ctl" id="ctl"><label>级数 S：</label><span id="g1"></span><label style="margin-left:12px">耗时比：</label><span id="g2"></span></div>
<div class="stats"><div class="stat"><div class="l">总时间</div><div class="v" id="stt"></div></div><div class="stat"><div class="l">搬运忙碌率</div><div class="v" id="sl"></div></div><div class="stat"><div class="l">计算忙碌率</div><div class="v" id="sc"></div></div></div>
<p class="note">看点：① S = 1 时搬和算轮流，两条轴各闲一半；② S = 2 时下一块的搬运藏到了这一块的计算后面；③ 搬比算慢时，再多级也快不过"搬的总时间"。</p>
</main>
<script src="anim.js"></script>
<script src="cuda-anim.js"></script>
<script>
const sv=$('sv');
let S=2,R0=1,k=0;const N=6,RATIOS=[[4,2,'搬慢'],[3,3,'一样'],[2,4,'算慢']];
function sched(){const [tl,tc]=RATIOS[R0],LD=[],CD=[];
 for(let i=0;i<N;i++){let ls=i?LD[i-1].e:0;if(i>=S)ls=Math.max(ls,CD[i-S].e);LD.push({s:ls,e:ls+tl});const cs=Math.max(LD[i].e,i?CD[i-1].e:0);CD.push({s:cs,e:cs+tc})}return {LD,CD}}
function reset(){k=0;draw()}
function next(){if(k>=N)return false;k++;draw();return true}
function draw(){clear(sv);const {LD,CD}=sched(),tot=CD[N-1].e,sc=560/Math.max(tot,30),X=t=>100+t*sc,cols=['#185fa5','#1d9e75','#ba7517','#534ab7','#d85a30','#3b6d11'];
 cap(sv,k===0?`${N} 块，搬 ${RATIOS[R0][0]}、算 ${RATIOS[R0][1]}，${S} 级`:`第 ${k} 块`);
 T(sv,'搬',40,92,{bold:1});T(sv,'算',40,172,{bold:1});L0();
 function L0(){L(sv,100,110,670,110,{stroke:'var(--line)'});L(sv,100,190,670,190,{stroke:'var(--line)'})}
 for(let i=0;i<k;i++){R(sv,X(LD[i].s),72,(LD[i].e-LD[i].s)*sc-2,34,{fill:cols[i],stroke:'none'});T(sv,i,X(LD[i].s)+6,94,{fill:'#fff',size:12});
  R(sv,X(CD[i].s),152,(CD[i].e-CD[i].s)*sc-2,34,{fill:cols[i],stroke:'none'});T(sv,i,X(CD[i].s)+6,174,{fill:'#fff',size:12})}
 if(k>=N){L(sv,X(tot),60,X(tot),200,{stroke:'var(--bad)',dash:'4 3'});T(sv,`总时间 ${tot}`,X(tot)-4,220,{a:'end',fill:'var(--bad)'})}
 for(let t=0;t<=tot;t+=Math.max(2,Math.round(tot/12)))T(sv,t,X(t),240,{a:'middle',cls:'tiny'});
 const [tl,tc]=RATIOS[R0];stat('stt',k>=N?tot:'…');stat('sl',k>=N?(N*tl/tot*100).toFixed(0)+'%':'…');stat('sc',k>=N?(N*tc/tot*100).toFixed(0)+'%':'…');s1();s2();}
const s1=radio('g1',[1,2,3].map(v=>({id:'s'+v,label:String(v),value:v})),()=>S,v=>{S=v;reset()});
const s2=radio('g2',RATIOS.map((r,i)=>({id:'r'+i,label:r[2],value:i})),()=>R0,v=>{R0=v;reset()});
setupPlayer({captureSeed:1,reset,next},1100);
</script></body></html>
