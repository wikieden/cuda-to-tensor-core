<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>roofline</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.mono{font-family:ui-monospace,Menlo,monospace}svg text.tiny{font-size:10px;fill:var(--muted)}</style></head>
<body><main>
<h1>第 9 章 · roofline：算不过来还是搬不过来</h1>
<p class="sub">配套讲义：<a href="../lessons/09-roofline-profiling.html">第 9 章 · 性能分析：roofline、正确计时与 Nsight</a>。横轴算术强度（FLOP / 字节），纵轴可达性能，都是对数坐标。斜线是带宽上限，横线是算力上限，拐点是脊点。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 380"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row ctl" id="ctl"><label>GPU：</label><span id="g1"></span></div>
<div class="stats"><div class="stat"><div class="l">脊点（FLOP/byte）</div><div class="v" id="sr"></div></div><div class="stat"><div class="l">当前 kernel</div><div class="v" id="sk"></div></div><div class="stat"><div class="l">上限</div><div class="v" id="sp"></div></div></div>
<p class="note">看点：① 向量加法、ReLU 落在斜线上，评价它们看带宽利用率；② 大 GEMM 落在横线上；③ 换成 A6000 FP32，脊点从 295 降到 39。</p>
</main>
<script src="anim.js"></script>
<script src="cuda-anim.js"></script>
<script>
const sv=$('sv');
const GPUS=[{l:'H100 BF16',P:989e12,B:3.35e12},{l:'A6000 FP32',P:30e12,B:768e9}];
const KS=[{n:'向量加法 FP32',i:1/12},{n:'ReLU BF16',i:0.25},{n:'softmax BF16（约 5 FLOP/元素）',i:1.25},{n:'GEMM FP32 N=4096',i:683},{n:'GEMM BF16 N=4096',i:1365}];
let g=0,k=0;
const X=i=>60+(Math.log10(i)+2)/6*580,Y=p=>320-(Math.log10(p)-9)/7*280;
function reset(){k=0;draw()}
function next(){if(k>=KS.length)return false;k++;draw();return true}
function draw(){clear(sv);const G=GPUS[g],ridge=G.P/G.B;
 cap(sv,k===0?`${G.l}：峰值 ${(G.P/1e12).toFixed(0)} TFLOP/s，带宽 ${(G.B/1e12).toFixed(2)} TB/s`:KS[k-1].n);
 L(sv,60,320,650,320,{stroke:'var(--line)'});L(sv,60,40,60,320,{stroke:'var(--line)'});
 [0.01,0.1,1,10,100,1000,10000].forEach(v=>{L(sv,X(v),320,X(v),325,{stroke:'var(--line)'});T(sv,v,X(v),340,{a:'middle',cls:'tiny'})});
 [1e9,1e10,1e11,1e12,1e13,1e14,1e15,1e16].forEach(v=>{T(sv,v>=1e12?(v/1e12)+'T':(v/1e9)+'G',54,Y(v)+4,{a:'end',cls:'tiny'})});
 T(sv,'算术强度（FLOP / byte）',360,362,{a:'middle',cls:'m'});
 const i0=0.01,i1=1e4;L(sv,X(i0),Y(i0*G.B),X(ridge),Y(G.P),{stroke:'var(--accent)',sw:2.5});L(sv,X(ridge),Y(G.P),X(i1),Y(G.P),{stroke:'var(--warm)',sw:2.5});
 L(sv,X(ridge),Y(G.P),X(ridge),320,{stroke:'var(--muted)',dash:'4 3'});T(sv,`脊点 ≈ ${ridge.toFixed(0)}`,X(ridge)+4,Y(G.P)-8,{size:12});
 KS.slice(0,k).forEach((kk,j)=>{const p=Math.min(G.P,kk.i*G.B),on=j===k-1;el('circle',{cx:X(kk.i),cy:Y(p),r:on?7:5,fill:kk.i<ridge?'var(--accent)':'var(--warm)'},sv);if(on)T(sv,kk.n,X(kk.i)+(kk.i>100?-10:10),Y(p)+(kk.i>100?22:-10),{a:kk.i>100?'end':'start',size:12})});
 const kk=KS[k-1];stat('sr',ridge.toFixed(0));stat('sk',kk?(kk.i<ridge?'memory-bound':'compute-bound'):'—');stat('sp',kk?(Math.min(G.P,kk.i*G.B)/1e12).toFixed(2)+' TFLOP/s':'—');sy();}
const sy=radio('g1',GPUS.map((v,i)=>({id:'u'+i,label:v.l,value:i})),()=>g,v=>{g=v;reset()});
setupPlayer({captureSeed:1,reset,next},1500);
</script></body></html>
