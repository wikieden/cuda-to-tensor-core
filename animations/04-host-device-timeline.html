<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>host 与 device 时间线</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.mono{font-family:ui-monospace,Menlo,monospace}svg text.tiny{font-size:10px;fill:var(--muted)}</style></head>
<body><main>
<h1>第 4 章 · CPU 和 GPU 的时间线</h1>
<p class="sub">配套讲义：<a href="../lessons/04-host-device-program.html">第 4 章 · 一个完整的 CUDA 程序：分配、拷贝、启动、同步、查错</a>。上面一行是 CPU，下面一行是 GPU，中间是 PCIe 拷贝。kernel 启动是"下单"，CPU 不等它做完。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 340"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row ctl" id="ctl"><label>kernel 后同步：</label><span id="g1"></span><label style="margin-left:12px">CPU 计时器测 kernel：</label><span id="g2"></span></div>
<div class="stats"><div class="stat"><div class="l">CPU 计时器测到</div><div class="v" id="sm"></div></div><div class="stat"><div class="l">kernel 实际耗时</div><div class="v" id="sr"></div></div></div>
<p class="note">看点：① 启动 kernel 时 CPU 那一行只占一小格；② 不同步时 CPU 计时器只测到"下单"的几微秒；③ 不加同步，D2H 拷贝也会自动等 kernel 做完。</p>
</main>
<script src="anim.js"></script>
<script src="cuda-anim.js"></script>
<script>
const sv=$('sv');
let sync=1,timer=1,k=0;
function steps(){const s=[{who:'cpu',n:'cudaMalloc',t:0,d:4},{who:'pcie',n:'H2D 拷贝 A、B',t:4,d:24},{who:'cpu',n:'启动 kernel（下单）',t:28,d:2},{who:'gpu',n:'vecAdd 在跑',t:30,d:30}];
 if(sync){s.push({who:'cpu',n:'cudaDeviceSynchronize（等）',t:30,d:30});s.push({who:'pcie',n:'D2H 拷贝 C',t:60,d:12})}
 else{s.push({who:'cpu',n:'CPU 继续干别的',t:30,d:10});s.push({who:'pcie',n:'D2H（自动等 kernel 做完）',t:60,d:12})}
 return s}
function reset(){k=0;draw()}
function next(){if(k>=steps().length)return false;k++;draw();return true}
function draw(){clear(sv);const S=steps(),X=t=>110+t*7;
 cap(sv,k===0?'从头开始：分配 → 拷进 → 启动 → 同步 → 拷回':S[k-1].n);
 [['CPU','cpu',60],['PCIe','pcie',130],['GPU','gpu',200]].forEach(([n,w,y])=>{T(sv,n,20,y+22,{bold:1});L(sv,100,y+34,670,y+34,{stroke:'var(--line)'})});
 const Y={cpu:60,pcie:130,gpu:200},C={cpu:'var(--purple)',pcie:'var(--amber)',gpu:'var(--teal)'};
 S.slice(0,k).forEach(s=>{R(sv,X(s.t),Y[s.who],s.d*7-2,30,{fill:C[s.who],stroke:C[s.who]});T(sv,s.n,X(s.t)+4,Y[s.who]+19,{size:11,fill:'#fff'})});
 if(timer&&k>=3){const t0=28,t1=sync?60:30;L(sv,X(t0),262,X(t0),300,{stroke:'var(--bad)',dash:'4 3'});L(sv,X(t1),262,X(t1),300,{stroke:'var(--bad)',dash:'4 3'});L(sv,X(t0),290,X(t1),290,{stroke:'var(--bad)'});T(sv,sync?'CPU 计时器：从下单到同步返回 ≈ kernel 真实耗时':'CPU 计时器：只测到"下单"',X(t0)+4,318,{fill:'var(--bad)',size:12})}
 stat('sm',timer?(sync?'≈ 30 单位（含启动）':'≈ 2 单位（只是下单）'):'—');stat('sr','30 单位');s1();s2();}
const s1=radio('g1',[{id:'y1',label:'有',value:1},{id:'y0',label:'没有',value:0}],()=>sync,v=>{sync=v;reset()});
const s2=radio('g2',[{id:'t1',label:'开',value:1},{id:'t0',label:'关',value:0}],()=>timer,v=>{timer=v;reset()});
setupPlayer({captureSeed:1,reset,next},1300);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
