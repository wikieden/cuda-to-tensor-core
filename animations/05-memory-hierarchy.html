<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPU 内存层级</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.mono{font-family:ui-monospace,Menlo,monospace}svg text.tiny{font-size:10px;fill:var(--muted)}</style></head>
<body><main>
<h1>第 5 章 · 内存层级：越近越快越小</h1>
<p class="sub">配套讲义：<a href="../lessons/05-memory-hierarchy.html">第 5 章 · GPU 内存层级：寄存器、shared memory、L1 / L2、显存</a>。从显存往上到寄存器，条形长度是容量（对数比例），右边是相对延迟和谁来管。最后演示"读一次、用很多次"。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 400"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row ctl" id="ctl"><label>点一层看详情：</label><span id="g1"></span></div>
<div class="stats"><div class="stat"><div class="l">容量（H100）</div><div class="v" id="sc"></div></div><div class="stat"><div class="l">作用域</div><div class="v" id="sd"></div></div><div class="stat"><div class="l">谁来管</div><div class="v" id="sw"></div></div></div>
<p class="note">看点：① 每往外一层，延迟约高一个数量级、容量大一到两个数量级；② 寄存器总量和 shared + L1 一样大；③ 最后一帧：数据从显存搬上 shared 一次，被 8 个线程复用。</p>
</main>
<script src="anim.js"></script>
<script src="cuda-anim.js"></script>
<script>
const sv=$('sv');
const LV=[{n:'寄存器',c:'每 SM 256 KB（64K × 32 位）',lg:5.4,lat:'1×',sc:'单个线程',w:'编译器'},{n:'shared memory / L1',c:'每 SM 256 KB（shared 最多 228 KB）',lg:5.4,lat:'~10×',sc:'一个 block',w:'你（shared）/ 硬件（L1）'},
 {n:'L2 cache',c:'50 MB，全 GPU 共享',lg:7.7,lat:'~100×',sc:'所有 SM',w:'硬件'},{n:'显存 HBM3',c:'80 GB，约 3.35 TB/s',lg:10.9,lat:'~300×+',sc:'所有线程 + host',w:'你（分配、拷贝、访问模式）'}];
let k=0,pick=-1;
function reset(){k=0;pick=-1;draw()}
function next(){if(k>=5)return false;k++;pick=k<=4?4-k:-1;draw();return true}
function draw(){clear(sv);
 cap(sv,k===0?'从显存开始往上走':k<=4?LV[4-k].n:'读一次、用很多次');
 LV.forEach((v,i)=>{const y=60+i*58,show=k>=4-i||pick===i,on=pick===i;
  R(sv,20,y,170,44,{fill:on?'var(--accent-bg)':'var(--card)',stroke:on?'var(--accent)':'var(--line)',op:show?1:.3});T(sv,v.n,30,y+27,{bold:on,size:13});
  if(show){R(sv,200,y+10,(v.lg-4.5)*55,24,{fill:'var(--accent-bg)',stroke:'var(--teal)'});T(sv,v.c,206,y+27,{size:11});T(sv,'延迟 '+v.lat,600,y+27,{size:12})}});
 if(k>=5){const y=300;R(sv,20,y,120,40,{fill:'var(--amber)',stroke:'var(--amber)'});T(sv,'显存：tile 读 1 次',80,y+25,{a:'middle',size:11,fill:'#fff'});
  L(sv,140,y+20,210,y+20,{arrow:1});R(sv,212,y,120,40,{fill:'var(--accent-bg)',stroke:'var(--accent)'});T(sv,'shared 里的 tile',272,y+25,{a:'middle',size:12});
  for(let t=0;t<8;t++){L(sv,332,y+20,400+t*34,y+64,{stroke:'var(--accent)'});R(sv,388+t*34,y+64,26,22,{fill:'var(--accent)',stroke:'var(--accent)'});T(sv,'t'+t,401+t*34,y+79,{a:'middle',size:10,fill:'#fff'})}
  T(sv,'8 个线程各读 1 次 shared：显存流量变成 1/8',400,y+10,{size:12})}
 const v=LV[pick];stat('sc',v?v.c:'—');stat('sd',v?v.sc:'—');stat('sw',v?v.w:'—');sy();}
const sy=radio('g1',LV.map((v,i)=>({id:'l'+i,label:v.n,value:i})),()=>pick,v=>{pick=v;k=5-1-0;k=Math.max(k,4);draw()});
setupPlayer({captureSeed:1,reset,next},1400);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
