<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>block 分波执行</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.mono{font-family:ui-monospace,Menlo,monospace}svg text.tiny{font-size:10px;fill:var(--muted)}</style></head>
<body><main>
<h1>第 2 章 · block 一波一波派到 SM 上</h1>
<p class="sub">配套讲义：<a href="../lessons/02-block-scheduling.html">第 2 章 · block 为什么必须互不依赖：block 怎么被分到 SM 上</a>。左边排队的是 block（工单），右边是 4 个 SM（车间）。谁空派给谁，顺序不保证；最后一波不满就是尾巴。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 380"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row ctl" id="ctl"><label>grid 大小：</label><span id="g1"></span><label style="margin-left:12px">每个 SM 放几个 block：</label><span id="g2"></span></div>
<div class="stats"><div class="stat"><div class="l">波数 = ⌈grid / (SM × 每 SM)⌉</div><div class="v" id="sw"></div></div><div class="stat"><div class="l">利用率</div><div class="v" id="su"></div></div><div class="stat"><div class="l">最后一波空槽</div><div class="v" id="sl"></div></div></div>
<p class="note">看点：① 每次"从头开始"，block 被派到哪个 SM 的顺序都会变——它们互不依赖，所以结果不变；② 最后一波红色空槽就是尾部浪费；③ 答完讲义题 2 再把 grid 调成 33。</p>
</main>
<script src="anim.js"></script>
<script src="cuda-anim.js"></script>
<script>
const sv=$('sv');
let G=20,P=2,k=0,order=[];const S=4;
function reset(){order=[...Array(G).keys()];for(let i=G-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]]}k=0;draw()}
function waves(){return Math.ceil(G/(S*P))}
function next(){if(k>=waves()+1)return false;k++;draw();return true}
function draw(){clear(sv);const W=waves(),slots=S*P;
 cap(sv,k===0?`grid = ${G} 个 block，GPU 有 ${S} 个 SM，每个 SM 同时放 ${P} 个`:k<=W?`第 ${k} 波：${Math.min(slots,G-(k-1)*slots)} 个 block 同时在跑`:`全部完成：${W} 波，利用率 ${(G/(W*slots)*100).toFixed(0)}%`);
 // 队列
 T(sv,'排队中',20,52,{cls:'m'});const running=k>=1&&k<=W?order.slice((k-1)*slots,k*slots):[];
 const waiting=order.slice(k>W?G:k===0?0:k*slots);
 waiting.slice(0,36).forEach((b,i)=>{const x=20+(i%6)*30,y=62+Math.floor(i/6)*30;R(sv,x,y,26,24,{fill:'var(--card)'});T(sv,b,x+13,y+16,{a:'middle',cls:'tiny'})});
 // SM
 for(let s=0;s<S;s++){const x=230+s*110,y=60;R(sv,x,y,100,40+P*44,{fill:'var(--card)',rx:8});T(sv,`SM ${s}`,x+50,y+20,{a:'middle',bold:1});
  for(let p=0;p<P;p++){const sy=y+32+p*44,idx=s*P+p,b=running[idx];
   const tail=k===W&&b===undefined;R(sv,x+10,sy,80,36,{fill:b!==undefined?'var(--accent)':tail?'var(--bad)':'var(--bg)',stroke:b!==undefined?'var(--accent)':tail?'var(--bad)':'var(--line)',op:tail?.35:1});
   if(b!==undefined)T(sv,`block ${b}`,x+50,sy+23,{a:'middle',fill:'#fff'});else if(tail)T(sv,'空槽',x+50,sy+23,{a:'middle',fill:'var(--bad)'});}}
 // 完成
 const fin=k>W?order:order.slice(0,Math.max(0,(k-1)*slots));T(sv,'已完成（顺序 = 派发顺序，不保证从小到大）',230,290,{cls:'m'});
 fin.slice(0,40).forEach((b,i)=>{const x=230+(i%14)*31,y=300+Math.floor(i/14)*24;R(sv,x,y,27,20,{fill:'var(--accent-bg)',stroke:'var(--accent)'});T(sv,b,x+13.5,y+14,{a:'middle',cls:'tiny'})});
 stat('sw',W);stat('su',(G/(W*slots)*100).toFixed(0)+'%');stat('sl',W*slots-G);sy1();sy2();}
const sy1=radio('g1',[8,20,33].map(v=>({id:'g'+v,label:String(v),value:v})),()=>G,v=>{G=v;seed(Date.now());reset()});
const sy2=radio('g2',[1,2].map(v=>({id:'p'+v,label:String(v),value:v})),()=>P,v=>{P=v;seed(Date.now());reset()});
setupPlayer({captureSeed:5,reset:s=>{seed(s);reset()},next},1400);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
